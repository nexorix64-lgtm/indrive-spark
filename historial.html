<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>Historial - InDrive Spark</title></head><body><div class="app">
<header><h1>📊 Historial</h1><div class="sub">Tus carreras y ganancias</div></header>
<nav><a href="index.html">🧮 Calcular</a><a class="active" href="historial.html">📊 Historial</a><a href="ajustes.html">⚙️ Ajustes</a></nav>
<section class="card"><div class="grid"><div class="stat">💰 Ganancia neta<b id="dayProfit">$0</b></div><div class="stat">🚗 Carreras<b id="dayRides">0</b></div><div class="stat">📍 Km<b id="dayKm">0</b></div><div class="stat">⛽ Costos<b id="dayCost">$0</b></div></div>
<p><b>🎯 Meta diaria</b> <span id="goal">$100.000</span></p><div class="goalbar"><div class="goalfill" id="fill"></div></div><p class="small" id="pct">0% de la meta</p></section>
<section class="card"><h3 style="margin-top:0">📜 Carreras guardadas</h3><div id="history" class="history"></div><button class="secondary" onclick="clearHistory()">Borrar historial</button></section>
<script>
const KEY='indriveSparkV3Settings', HIST='indriveSparkV3History';
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0))}
function num(id){return parseFloat(document.getElementById(id).value)||0}
function settings(){return JSON.parse(localStorage.getItem(KEY)||'{"commission":0.095,"gasPrice":16000,"kmGal":42,"maintenance":300,"depreciation":150,"targetHour":15000,"dailyGoal":100000}')}
function kmCost(){const s=settings();return s.gasPrice/s.kmGal+s.maintenance+s.depreciation}
function calculateRace(p,k,offer,mins){
 const s=settings(), total=p+k, cost=total*kmCost(), timeCost=s.targetHour*(total/30);
 const rec=Math.ceil(((cost+timeCost)/(1-s.commission)*1.15)/1000)*1000;
 const ideal=Math.ceil(rec*1.2/1000)*1000, net=offer*(1-s.commission), profit=net-cost;
 const hourly=mins>0?profit/(mins/60):0, netKm=total>0?net/total:0;
 let d='MALA'; if(offer>=ideal)d='EXCELENTE'; else if(offer>=rec)d='BUENA';
 return {p,k,total,offer,mins,cost,rec,ideal,net,profit,hourly,netKm,d,date:new Date().toISOString()};
}

function render(){const h=JSON.parse(localStorage.getItem(HIST)||'[]'),s=settings();let profit=0,km=0,cost=0;h.forEach(x=>{profit+=x.profit;km+=x.total;cost+=x.cost});dayProfit.textContent=money(profit);dayRides.textContent=h.length;dayKm.textContent=km.toFixed(1);dayCost.textContent=money(cost);goal.textContent=money(s.dailyGoal);let pct=s.dailyGoal?Math.min(100,Math.max(0,profit/s.dailyGoal*100)):0;fill.style.width=pct+'%';document.getElementById('pct').textContent=pct.toFixed(0)+'% de la meta';
history.innerHTML=h.length?h.map(x=>`<div class="hist"><b>${money(x.offer)} <span class="badge ${x.d==='EXCELENTE'?'b-ex':x.d==='BUENA'?'b-good':'b-bad'}">${x.d}</span></b><span>${x.p.toFixed(1)} km recogida + ${x.k.toFixed(1)} km pasajero · ${x.mins} min</span><br><span>Ganancia: ${money(x.profit)} · Neto/km: ${money(x.netKm)}</span></div>`).join(''):'<p class="small">Todavía no hay carreras guardadas.</p>';}
function clearHistory(){if(confirm('¿Borrar todo el historial?')){localStorage.removeItem(HIST);render()}} render();
</script></div></body></html>
